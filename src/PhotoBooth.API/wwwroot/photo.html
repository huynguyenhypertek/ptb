<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PhotoBooth - Tải ảnh</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        .header {
            text-align: center;
            padding: 30px 20px 15px;
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .header p {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        .photo-container {
            width: 90%;
            max-width: 400px;
            margin: 10px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            background: #1a1a2e;
            position: relative;
        }

        .photo-container img {
            width: 100%;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            color: #888;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #ffd200;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .download-btn {
            display: block;
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            padding: 16px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(247, 151, 30, 0.3);
            transition: transform 0.2s;
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 12px;
        }

        .error {
            text-align: center;
            padding: 60px 20px;
        }

        .error .icon { font-size: 60px; margin-bottom: 15px; }
        .error h2 { color: #e94560; margin-bottom: 10px; }
        .error p { color: #888; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📸 PHOTOBOOTH</h1>
        <p>Ảnh của bạn đã sẵn sàng!</p>
    </div>

    <div id="content">
        <div class="loading">
            <div class="spinner"></div>
            <p>Đang tải ảnh...</p>
        </div>
    </div>

    <div id="footer" class="footer" style="display:none">
        <p>Nhấn giữ ảnh để lưu vào điện thoại</p>
        <p style="margin-top:8px">© Quacky Photobooth • Cảm ơn bạn! 💛</p>
    </div>

    <script>
        // Get photo code from URL: /photos/abc123
        const path = window.location.pathname;
        const code = path.split('/').pop();
        const apiBase = window.location.origin;

        if (code) {
            const img = new Image();
            img.onload = function() {
                document.getElementById('content').innerHTML = `
                    <div class="photo-container">
                        <img src="${apiBase}/api/photos/${code}/image" alt="PhotoBooth">
                    </div>
                    <a href="${apiBase}/api/photos/${code}/download" class="download-btn">
                        📥 TẢI ẢNH VỀ MÁY
                    </a>
                `;
                document.getElementById('footer').style.display = 'block';
            };
            img.onerror = function() {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <div class="icon">😔</div>
                        <h2>Không tìm thấy ảnh</h2>
                        <p>Ảnh có thể đã hết hạn hoặc link không đúng</p>
                    </div>
                `;
            };
            img.src = `${apiBase}/api/photos/${code}/image`;
        }
    </script>
</body>
</html>
